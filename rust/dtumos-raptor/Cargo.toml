[package]
name = "dtumos-raptor"
version = "0.1.0"
edition = "2021"

[lib]
name = "dtumos_raptor"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
numpy = "0.22"
csv = "1"
rayon = "1.10"
rstar = "0.12"
arc-swap = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
polyline = "0.11"
smallvec = "1.13"
bincode = "1"
h3o = "0.7"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
